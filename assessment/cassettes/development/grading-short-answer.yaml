- request:
    body: "{\"input\":\"\\n                Review the following response ActiveSupport::Concern
      is appropriate when we want to extract commonly used methods. In order to avoid
      concerns becoming unstructured ground, concerns should be organised in modules
      and distinct files in accordance with functional similarities. For instance
      concerns for sanitising input should be distinctly separate from concerns for
      text formatting. Under-utilised concerns by their host class indicates that
      not every included concern is useful. to the following question When is `ActiveSupport::Concern`
      appropriate, and what warning signs indicate that a concern has become an unstructured
      dumping ground?.\\n                Evaluate the quality of the response through
      the lens of this criteria coverage.\\n                Provide an assessment
      score for each critera on a continuous scale of 0 to 1,\\n                where
      0 indicates no score and 1 indicates an extremely excellent score.\\n                A
      score is excellent if it is closely aligned to the model score and the given
      criteria.\\n                Base your marking/grading scheme through the following
      accepted points Shared behavior represents one cohesive capability.,The concern
      has a narrow and discoverable API.,Host requirements are explicit or minimal.,Unrelated
      methods indicate low cohesion.,Numerous hidden callbacks or side effects are
      a warning sign.,Cross-domain workflows are better represented by explicit services
      or collaborators..\\n                This is the model, perfect or ideal answer
      A concern is appropriate for a cohesive capability shared by multiple classes,
      with a narrow, well-named contract and minimal assumptions about the host. Warning
      signs include unrelated methods, many callbacks, extensive host-column assumptions,
      callback ordering dependencies, cross-domain orchestration, or a generic name
      such as `Common` or `SharedMethods`. Composition through dedicated objects may
      then be preferable..\\n                Provide a final headline assessment i.e.\\n
      \               for an extremely excellent score you can respond with \u201CPerfect
      response\u201D,\\n                for a poor response you can respond with \u201CInadequate\u201D
      response.\\n                These examples serves as guides to help you facilitate
      judgement.\\n                Additionally, provide a rationale for your assessment
      i.e. \u201CYou covered most of the key ideas\u201D\\n            \",\"model\":\"gpt-5.6\",\"text\":{\"format\":{\"type\":\"json_schema\",\"name\":\"grade_short_answer\",\"schema\":{\"type\":\"object\",\"properties\":{\"criteria_scores\":{\"type\":\"array\",\"description\":\"A
      score for each accepted point used to grade the answer.\",\"items\":{\"type\":\"object\",\"properties\":{\"criterion\":{\"type\":\"string\",\"description\":\"The
      accepted point being assessed.\"},\"score\":{\"type\":\"number\",\"minimum\":0,\"maximum\":1,\"description\":\"How
      well the response covers the criterion, from 0 (not covered) to 1 (excellent
      coverage).\"}},\"required\":[\"criterion\",\"score\"],\"additionalProperties\":false}},\"headline_assessment\":{\"type\":\"string\",\"description\":\"A
      concise overall assessment, such as 'Perfect response' or 'Inadequate response'.\"},\"rationale\":{\"type\":\"string\",\"description\":\"A
      concise explanation of the assessment based on the model answer and accepted
      points.\"}},\"required\":[\"criteria_scores\",\"headline_assessment\",\"rationale\"],\"additionalProperties\":false},\"strict\":true}}}"
