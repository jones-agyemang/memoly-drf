      medication may be a contributing factor to the following question Explain why
      a new heart rate of 54 beats/min may be more concerning in one patient than
      a long-standing resting rate of 54 beats/min in another..\\n                Evaluate
      the quality of the response through the lens of this criteria coverage.\\n                Provide
      an assessment score for each critera on a continuous scale of 0 to 1,\\n                where
      0 indicates no score and 1 indicates an extremely excellent score.\\n                A
      score is excellent if it is closely aligned to the model score and the given
      criteria.\\n                Base your marking/grading scheme through the following
      accepted points Recognizes the importance of change from baseline,Identifies
      hypoxia or medication effects as possible causes,Connects symptoms and abnormal
      vital signs with greater urgency,Recognizes that chronic asymptomatic bradycardia
      can be normal for some individuals.\\n                This is the model, perfect
      or ideal answer A new rate of 54 beats/min represents a change from baseline
      and may reflect hypoxia, medication effects, conduction problems, or advanced
      deterioration, particularly if accompanied by hypotension, altered consciousness,
      respiratory depression, or poor perfusion. A long-standing rate of 54 beats/min
      may be normal in an asymptomatic person, such as a trained athlete, when other
      observations are stable..\\n                Provide a final headline assessment
      i.e.\\n                for an extremely excellent score you can respond with
      \u201CPerfect response\u201D,\\n                for a poor response you can
      respond with \u201CInadequate\u201D response.\\n                These examples
      serves as guides to help you facilitate judgement.\\n                Additionally,
      provide a rationale for your assessment i.e. \u201CYou covered most of the key
      ideas\u201D\\n            \",\"model\":\"gpt-5.6\",\"text\":{\"format\":{\"type\":\"json_schema\",\"name\":\"grade_short_answer\",\"schema\":{\"type\":\"object\",\"properties\":{\"criteria_scores\":{\"type\":\"array\",\"description\":\"A
      score for each accepted point used to grade the answer.\",\"items\":{\"type\":\"object\",\"properties\":{\"criterion\":{\"type\":\"string\",\"description\":\"The
      accepted point being assessed.\"},\"score\":{\"type\":\"number\",\"minimum\":0,\"maximum\":1,\"description\":\"How
      well the response covers the criterion, from 0 (not covered) to 1 (excellent
      coverage).\"}},\"required\":[\"criterion\",\"score\"],\"additionalProperties\":false}},\"headline_assessment\":{\"type\":\"string\",\"description\":\"A
      concise overall assessment, such as 'Perfect response' or 'Inadequate response'.\"},\"rationale\":{\"type\":\"string\",\"description\":\"A
      concise explanation of the assessment based on the model answer and accepted
      points.\"}},\"required\":[\"criteria_scores\",\"headline_assessment\",\"rationale\"],\"additionalProperties\":false},\"strict\":true}}}"
