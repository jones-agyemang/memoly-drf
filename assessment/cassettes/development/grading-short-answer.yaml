- request:
    body: "{\"input\":\"\\n                Review the following response after_commit
      comes after the record passes validation and it's yet to be persisted in the
      databases. after_save is fired after the record is successfully saved to the
      database. Triggering an external notification is better after the after_save
      callback is fired. A quick read of the record from the database prior to sending
      the external notification will ensure that the record has indeed been successfully
      persisted. to the following question Compare `after_save` and `after_commit`
      for triggering an external notification. Which is generally safer, and what
      additional reliability mechanism may be needed?.\\n                Evaluate
      the quality of the response through the lens of this criteria coverage.\\n                Provide
      an assessment score for each critera on a continuous scale of 0 to 1,\\n                where
      0 indicates no score and 1 indicates an extremely excellent score.\\n                A
      score is excellent if it is closely aligned to the model score and the given
      criteria.\\n                Base your marking/grading scheme through the following
      accepted points Explains that `after_save` can run before commit.,Explains that
      `after_commit` does not run for a rolled-back transaction.,Recognizes that `after_commit`
      alone does not guarantee delivery.,Mentions a transactional outbox or durable
      job-enqueue strategy.,Mentions retries and idempotency for external side effects..\\n
      \               This is the model, perfect or ideal answer `after_save` runs
      before the surrounding transaction has necessarily committed, so an external
      observer may act on data that is later rolled back or not yet visible. `after_commit`
      runs only after a successful commit and is therefore safer, but direct delivery
      can still be lost if the process crashes after commit. A transactional outbox
      or reliably persisted job record provides stronger delivery guarantees, with
      idempotent consumers or jobs handling retries..\\n                Provide a
      final headline assessment i.e.\\n                for an extremely excellent
      score you can respond with \u201CPerfect response\u201D,\\n                for
      a poor response you can respond with \u201CInadequate\u201D response.\\n                These
      examples serves as guides to help you facilitate judgement.\\n                Additionally,
      provide a rationale for your assessment i.e. \u201CYou covered most of the key
      ideas\u201D\\n            \",\"model\":\"gpt-5.6\",\"text\":{\"format\":{\"type\":\"json_schema\",\"name\":\"grade_short_answer\",\"schema\":{\"type\":\"object\",\"properties\":{\"criteria_scores\":{\"type\":\"array\",\"description\":\"A
      score for each accepted point used to grade the answer.\",\"items\":{\"type\":\"object\",\"properties\":{\"criterion\":{\"type\":\"string\",\"description\":\"The
      accepted point being assessed.\"},\"score\":{\"type\":\"number\",\"minimum\":0,\"maximum\":1,\"description\":\"How
      well the response covers the criterion, from 0 (not covered) to 1 (excellent
      coverage).\"}},\"required\":[\"criterion\",\"score\"],\"additionalProperties\":false}},\"headline_assessment\":{\"type\":\"string\",\"description\":\"A
      concise overall assessment, such as 'Perfect response' or 'Inadequate response'.\"},\"rationale\":{\"type\":\"string\",\"description\":\"A
      concise explanation of the assessment based on the model answer and accepted
      points.\"}},\"required\":[\"criteria_scores\",\"headline_assessment\",\"rationale\"],\"additionalProperties\":false},\"strict\":true}}}"
