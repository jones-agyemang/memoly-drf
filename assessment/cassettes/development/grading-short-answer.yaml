    body: "{\"input\":\"\\n                Review the following response Business
      analysis involves understanding the nature of the business and clarifying work.
      Any member of the team is capable of contributing to the work. to the following
      question Explain the difference between a business analyst role and business
      analysis as a capability in an agile team..\\n                Evaluate the quality
      of the response through the lens of this criteria coverage.\\n                Provide
      an assessment score for each critera on a continuous scale of 0 to 1,\\n                where
      0 indicates no score and 1 indicates an extremely excellent score.\\n                A
      score is excellent if it is closely aligned to the model score and the given
      criteria.\\n                Base your marking/grading scheme through the following
      accepted points Distinguishes a formal role or title from a skill set or capability.,States
      that the capability remains necessary without a dedicated role.,Identifies at
      least one business analysis activity, such as understanding needs or clarifying
      work.,Recognizes that multiple team members may contribute to the capability..\\n
      \               This is the model, perfect or ideal answer A business analyst
      role is a formal position or job title assigned to a person. Business analysis
      is the broader set of skills and ways of thinking used to understand needs,
      shape work, clarify priorities, communicate with stakeholders, and support decisions.
      An agile team needs the capability even when it does not include the formal
      role..\\n                Provide a final headline assessment i.e.\\n                for
      an extremely excellent score you can respond with \u201CPerfect response\u201D,\\n
      \               for a poor response you can respond with \u201CInadequate\u201D
      response.\\n                These examples serves as guides to help you facilitate
      judgement.\\n                Additionally, provide a rationale for your assessment
      i.e. \u201CYou covered most of the key ideas\u201D\\n            \",\"model\":\"gpt-5.6\",\"text\":{\"format\":{\"type\":\"json_schema\",\"name\":\"grade_short_answer\",\"schema\":{\"type\":\"object\",\"properties\":{\"criteria_scores\":{\"type\":\"array\",\"description\":\"A
      score for each accepted point used to grade the answer.\",\"items\":{\"type\":\"object\",\"properties\":{\"criterion\":{\"type\":\"string\",\"description\":\"The
      accepted point being assessed.\"},\"score\":{\"type\":\"number\",\"minimum\":0,\"maximum\":1,\"description\":\"How
      well the response covers the criterion, from 0 (not covered) to 1 (excellent
      coverage).\"}},\"required\":[\"criterion\",\"score\"],\"additionalProperties\":false}},\"headline_assessment\":{\"type\":\"string\",\"description\":\"A
      concise overall assessment, such as 'Perfect response' or 'Inadequate response'.\"},\"rationale\":{\"type\":\"string\",\"description\":\"A
      concise explanation of the assessment based on the model answer and accepted
      points.\"}},\"required\":[\"criteria_scores\",\"headline_assessment\",\"rationale\"],\"additionalProperties\":false},\"strict\":true}}}"
