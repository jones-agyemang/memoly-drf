    body: "{\"input\":\"\\n                Review the following response It must have
      clear responsibilities with expected inputs producing expected output. It should
      produce verifiable output for its callers to determine whether the operation
      succeeded or not. In order to avoid callers interpreting nil results as failure
      provide an operational success and failure mechanism that the caller can understand,
      as a soft contract. to the following question Describe three characteristics
      of a well-designed Service Object and explain how its caller should determine
      whether the operation succeeded..\\n                Evaluate the quality of
      the response through the lens of this criteria coverage.\\n                Provide
      an assessment score for each critera on a continuous scale of 0 to 1,\\n                where
      0 indicates no score and 1 indicates an extremely excellent score.\\n                A
      score is excellent if it is closely aligned to the model score and the given
      criteria.\\n                Base your marking/grading scheme through the following
      accepted points Represents a cohesive use case or business operation.,Uses explicit
      inputs rather than controller globals such as `params` or `current_user`.,Injects
      external dependencies such as gateways where practical.,Has one clear public
      entry point, commonly `call`.,Uses a result object or documented exception contract.,Keeps
      internal orchestration methods private and is independently testable..\\n                This
      is the model, perfect or ideal answer A strong Service Object represents one
      use case, accepts explicit inputs and injected dependencies, exposes a small
      public API such as `call`, and returns or raises an explicit outcome. A result
      object can expose `success?`, the created value, an error code, and errors;
      alternatively, documented domain exceptions may represent failures..\\n                Provide
      a final headline assessment i.e.\\n                for an extremely excellent
      score you can respond with \u201CPerfect response\u201D,\\n                for
      a poor response you can respond with \u201CInadequate\u201D response.\\n                These
      examples serves as guides to help you facilitate judgement.\\n                Additionally,
      provide a rationale for your assessment i.e. \u201CYou covered most of the key
      ideas\u201D\\n            \",\"model\":\"gpt-5.6\",\"text\":{\"format\":{\"type\":\"json_schema\",\"name\":\"grade_short_answer\",\"schema\":{\"type\":\"object\",\"properties\":{\"criteria_scores\":{\"type\":\"array\",\"description\":\"A
      score for each accepted point used to grade the answer.\",\"items\":{\"type\":\"object\",\"properties\":{\"criterion\":{\"type\":\"string\",\"description\":\"The
      accepted point being assessed.\"},\"score\":{\"type\":\"number\",\"minimum\":0,\"maximum\":1,\"description\":\"How
      well the response covers the criterion, from 0 (not covered) to 1 (excellent
      coverage).\"}},\"required\":[\"criterion\",\"score\"],\"additionalProperties\":false}},\"headline_assessment\":{\"type\":\"string\",\"description\":\"A
      concise overall assessment, such as 'Perfect response' or 'Inadequate response'.\"},\"rationale\":{\"type\":\"string\",\"description\":\"A
      concise explanation of the assessment based on the model answer and accepted
      points.\"}},\"required\":[\"criteria_scores\",\"headline_assessment\",\"rationale\"],\"additionalProperties\":false},\"strict\":true}}}"
