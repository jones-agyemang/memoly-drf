    body: '{"input":"\n            Create a skill assessment based on: {''topic'':
      ''# Business Analysis as a Core Agile Capability\\nBusiness analysis is a **critical
      skill set** across many stages of an agile iteration. It supports understanding
      needs, shaping work, clarifying priorities, and helping the team make effective
      decisions.\\n\\n# Business Analysis Beyond the Job Title\\nSome agile methods
      do not explicitly define a dedicated **business analyst** role. However, the
      need for business analysis does not disappear. The necessary skills still need
      to exist within the team.\\n\\n# Business Analysis Skills Improve Agile Outcomes\\nKey
      agile artefacts and practices depend on strong business analysis thinking. These
      skills can influence whether the team succeeds or fails by improving:\\n- clarity
      of requirements,\\n- understanding of business needs,\\n- communication among
      stakeholders,\\n- and decision quality during iterations.\\n\\n# Shared Capability
      Within the Team\\nEven where there is no dedicated business analyst, the agile
      team should still contain enough people with business analysis capability. The
      goal is not necessarily for **every** team member to have deep expertise, but
      for the team collectively to have enough of the mindset and skills to support
      delivery.''}.  \n            \"Wrap code blocks in triple backticks with language
