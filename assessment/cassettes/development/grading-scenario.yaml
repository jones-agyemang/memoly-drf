      1, ''question'': ''Which expression finds students taking both courses, and
      what is its result?'', ''user_response'': ''python_students & java_students
      = {\"Bo\", \"Dia\"}'', ''scenario_grade_guide'': {''expected_answer'': ''Use
      `python_students & java_students`. The result is `{\"Bo\", \"Dia\"}`.'', ''accepted_alternatives'':
      [''`java_students & python_students` with the same result.'', ''Using the `.intersection()`
      method with the same result.'']}}, {''question_number'': 2, ''question'': ''Which
      expression finds students taking exactly one of the two courses, and what is
      its result?'', ''user_response'': ''python_students ^ java_students = {\"Ana\",
      \"Chen\", \"Eli\"}'', ''scenario_grade_guide'': {''expected_answer'': ''Use
      `python_students ^ java_students`. The result is `{\"Ana\", \"Chen\", \"Eli\"}`.'',
      ''accepted_alternatives'': [''`java_students ^ python_students` with the same
      result.'', ''Using the `.symmetric_difference()` method with the same result.'']}},
      {''question_number'': 3, ''question'': ''Which expression finds students taking
      Python but not Java, and what is its result?'', ''user_response'': ''python_students
      - java_students = {\"Ana\", \"Chen\"}'', ''scenario_grade_guide'': {''expected_answer'':
      ''Use `python_students - java_students`. The result is `{\"Ana\", \"Chen\"}`.'',
      ''accepted_alternatives'': [''Using `python_students.difference(java_students)`
      with the same result.'']}}]\n            The analysis summary contains information
      about question_number, question (based on the given scenario),\n            user_response
      is the user''s response to the question based on this scenario, and a scenario_grade_guide
      \n            contains grading guidance to help you evaluate the correctness
      of each analysis.\n\n            Evaluate the quality of the responses through
      the lens of the respective criteria coverage.\n            Provide an assessment
      score for each criteria on a continuous scale of 0 to 1,\n            where
      0 indicates no score and 1 indicates an extremely excellent score.\n            A
      score is excellent if it is closely aligned to the model score and the given
      criteria.\n            Base your marking/grading scheme on each analysis''s
      accepted_alternatives.\n\n            The expected_answer field holds the model,
      perfect or ideal answer.\n            Provide a final headline assessment i.e.\n            for
      an extremely excellent score you can respond with \"Perfect response\",\n            for
      a poor response you can respond wuth \"Inadequate\" response.\n            These
      examples serves as guides to help you facilitate judgement.\n            Additionally,
      provide a rationale for your assessment i.e. \"You covered most of the key ideas\"
      \n        ","model":"gpt-5.6","text":{"format":{"type":"json_schema","name":"grade_scenario","schema":{"type":"object","properties":{"analysis":{"type":"array","description":"One
      grading result for each analysis in the request.","items":{"type":"object","properties":{"question_number":{"type":"integer","minimum":1,"description":"The
      question_number from the corresponding analysis in the request."},"criteria_scores":{"type":"array","description":"Scores
      for the criteria derived from this analysis''s accepted_alternatives, using
      expected_answer as the ideal answer. Equivalent accepted alternatives are valid
      ways to satisfy a criterion, not separate requirements the user must all meet.","items":{"type":"object","properties":{"criterion":{"type":"string","description":"The
      grading criterion being assessed."},"score":{"type":"number","minimum":0,"maximum":1,"description":"How
      well the response covers the criterion, from 0 (not covered) to 1 (excellent
      coverage)."}},"required":["criterion","score"],"additionalProperties":false}}},"required":["question_number","criteria_scores"],"additionalProperties":false}},"headline_assessment":{"type":"string","description":"A
      concise final assessment across all analysis responses, such as ''Perfect response''
